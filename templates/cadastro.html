<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | British Cars</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="pagina-autenticacao">
        <h1>Criar conta</h1>
        <p>Cadastre-se para acessar sua conta no British Cars.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <p role="alert">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required maxlength="100">

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required maxlength="254">

            <label for="senha">Senha (mínimo de 8 caracteres)</label>
            <input id="senha" name="senha" type="password" minlength="8" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p>Já possui uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
        <a href="{{ url_for('inicio') }}">Voltar ao catálogo</a>
    </main>
</body>
</html>

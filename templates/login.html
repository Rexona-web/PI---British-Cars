<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | British Cars</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="pagina-autenticacao">
        <h1>Entrar</h1>
        <p>Acesse sua conta British Cars.</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <p role="alert">{{ mensagem }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required>

            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" required>

            <button type="submit">Entrar</button>
        </form>

        <p>Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
        <a href="{{ url_for('inicio') }}">Voltar ao catálogo</a>
    </main>
</body>
</html>
